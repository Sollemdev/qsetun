name: Feature Request
description: Suggest an enhancement or new feature
title: "[FEATURE] "
labels: ["enhancement"]
body:
  - type: textarea
    id: use-case
    attributes:
      label: Use Case
      description: What problem does this solve? What sensor/application is this for?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: How should this feature work?
    validations:
      required: true
  - type: dropdown
    id: invariant-impact
    attributes:
      label: Does this affect core invariants?
      description: "Would this change require floating-point ops, heap allocation, or break O(1) execution?"
      options:
        - "No — compatible with Zero-FLOP / Zero-Heap / O(1)"
        - "Yes — requires relaxing an invariant (explain in Proposed Solution)"
        - "Unsure"
    validations:
      required: true
